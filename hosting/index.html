<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>NorbuFlow</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fbf6ec;
        color: #2b1a17;
        font: 18px/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 26rem;
        margin: 1.5rem;
        padding: 2rem 1.75rem;
        background: #fff;
        border-top: 6px solid #7a1f2b;
        border-radius: 14px;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        color: #7a1f2b;
        font: 600 1.6rem/1.2 Georgia, serif;
      }
      p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <!-- Where a sign-in link lands when it is opened somewhere the app is
         not installed, such as a computer. -->
    <main>
      <h1>NorbuFlow</h1>
      <p>
        To sign in, open this email on the phone or tablet where you use NorbuFlow, and tap the
        link there.
      </p>
    </main>
  </body>
</html>
