name: Release

# Ships from main by hand: Actions -> Release -> Run workflow. Android goes to the chosen Play track
# and iOS to TestFlight. Both store builds use the version in pubspec.yaml, so bump it first. The
# lanes are in fastlane/Fastfile.
on:
  workflow_dispatch:
    inputs:
      android:
        description: Android
        type: boolean
        default: true
      android_track:
        description: Play track (alpha = closed testing, beta = open testing)
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      ios:
        description: iOS (TestFlight)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main' && (inputs.android || inputs.ios)
    uses: ./.github/workflows/ci.yml

  android:
    needs: checks
    if: inputs.android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml # environment: flutter, the app's one pin.
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      # android/gradle.properties asks for 8 GB, more than the runner has.
      - name: Fit Gradle to the runner
        run: sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m/' android/gradle.properties

      - run: bundle exec fastlane android release track:${{ inputs.android_track }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}

  ios:
    needs: checks
    if: inputs.ios
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml # environment: flutter, the app's one pin.
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - run: bundle exec fastlane ios release
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          IOS_CERT_TOKEN: ${{ secrets.IOS_CERT_TOKEN }}
